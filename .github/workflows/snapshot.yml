name: odds snapshot

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:             # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take snapshot (standard library only, no installs)
        run: python src/footmodel/value/cloud.py snapshot --log data/live/quotes_log.csv
      - name: Save the log
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data/live/quotes_log.csv
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
